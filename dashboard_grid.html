<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>AutoTherm — 4-Panel Dashboard</title>
<style>
*,html,body{margin:0;padding:0;box-sizing:border-box;}
body{background:#04090F;font-family:'Courier New',monospace;color:#C8E8FF;overflow:hidden;}

.grid{
  display:grid;
  grid-template-columns: 0.75fr 1.25fr;
  grid-template-rows: 1fr 1fr 1fr;
  gap:4px;
  width:100vw;
  height:100vh;
  background:#0a0f17;
  padding:4px;
}

.cell{
  position:relative;
  background:#04090F;
  border:1px solid #1E4060;
  border-radius:6px;
  overflow:hidden;
}

.cube      { grid-row: 1 / 3; grid-column: 1; }
.rth       { grid-row: 3;     grid-column: 1; }
.scaling   { grid-row: 1;     grid-column: 2; }
.max-atoms { grid-row: 2;     grid-column: 2; }
.gpu       { grid-row: 3;     grid-column: 2; }

iframe{
  display:block;
  width:100%;
  height:100%;
  border:0;
  background:#04090F;
}

.cell:hover { box-shadow: 0 0 18px rgba(0,216,255,0.15); }

/* ── Modal overlay ─────────────────────────────────────────────────────── */
#modal-backdrop{
  position:fixed;inset:0;
  background:rgba(2,6,12,0.92);
  backdrop-filter:blur(6px);
  display:none;
  z-index:1000;
  align-items:center;
  justify-content:center;
}
#modal-backdrop.open{display:flex;}

#modal-frame{
  position:relative;
  width:95vw;height:92vh;
  background:#04090F;
  border:1px solid #00D8FF;
  border-radius:10px;
  box-shadow: 0 0 60px rgba(0,216,255,0.35);
  overflow:hidden;
}

#modal-frame iframe{
  display:block;width:100%;height:100%;border:0;background:#04090F;
}

#modal-close{
  position:absolute;
  top:10px;right:10px;
  background:rgba(4,14,28,0.85);
  border:1px solid #FF4422;
  color:#FF4422;
  font-family:'Courier New',monospace;
  font-size:14px;font-weight:bold;
  padding:8px 16px;
  border-radius:6px;
  cursor:pointer;
  z-index:10;
  letter-spacing:.5px;
  transition:all .2s;
}
#modal-close:hover{
  background:#FF4422;color:#04090F;
}

</style>
</head>
<body>
<div class="grid">
  <div class="cell cube">
    <iframe src="viewer.html?minimal=1" loading="eager"></iframe>
  </div>
  <div class="cell rth">
    <iframe src="rth_graph.html" loading="eager"></iframe>
  </div>
  <div class="cell scaling">
    <iframe src="scaling_3d.html" loading="eager"></iframe>
  </div>
  <div class="cell max-atoms">
    <iframe src="max_atoms_3d.html" loading="eager"></iframe>
  </div>
  <div class="cell gpu">
    <iframe src="gpu_live_3d.html" loading="eager"></iframe>
  </div>
</div>

<!-- ── Modal overlay (hidden by default) ──────────────────────────────────── -->
<div id="modal-backdrop">
  <div id="modal-frame">
    <button id="modal-close">✕  CLOSE</button>
    <iframe id="modal-iframe" src="about:blank"></iframe>
  </div>
</div>

<script>
// ── Modal open/close ──────────────────────────────────────────────────────
const backdrop = document.getElementById('modal-backdrop');
const mIframe  = document.getElementById('modal-iframe');

function openModal(src, title) {
  // Mark the URL as expanded so the panel can suppress its hover tooltip
  const url = new URL(src);
  url.searchParams.set('expanded', '1');
  mIframe.src = url.toString();
  backdrop.classList.add('open');
}

function closeModal() {
  backdrop.classList.remove('open');
  // Release iframe to stop any running animations / polling
  setTimeout(() => { mIframe.src = 'about:blank'; }, 200);
}

document.getElementById('modal-close').addEventListener('click', closeModal);
backdrop.addEventListener('click', (e) => {
  if (e.target === backdrop) closeModal();
});
addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && backdrop.classList.contains('open')) closeModal();
});

// ── Listen for dblclick messages from iframes ─────────────────────────────
window.addEventListener('message', (e) => {
  const d = e.data;
  if (!d || d.type !== 'expand') return;
  openModal(d.src, d.title || 'EXPANDED VIEW');
});
</script>
</body>
</html>
